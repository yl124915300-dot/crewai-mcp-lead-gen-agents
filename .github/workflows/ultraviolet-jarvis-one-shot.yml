name: Ultraviolet one-shot Jarvis registration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register Jarvis once and verify discovery
        shell: python
        run: |
          import json
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://facilitator.ultravioletadao.xyz"
          resource_url = "https://jarvis-problem-intake.naijunyu.chatgpt.site/b2b/domain-verify"
          openapi_url = "https://jarvis-problem-intake.naijunyu.chatgpt.site/openapi.json"
          description = (
              "Company-domain identity and entity-resolution preflight for agents. "
              "Check whether a website belongs to the intended company, resolve the "
              "canonical domain, and guard paid Hunter, Apollo, people-search, or "
              "lead-enrichment calls from targeting the wrong company."
          )
          headers = {
              "Accept": "application/json",
              "User-Agent": "jarvis-ultraviolet-one-shot/1.0",
          }

          def get_exact_match():
              params = urllib.parse.urlencode({
                  "limit": 100,
                  "offset": 0,
                  "q": "jarvis-problem-intake.naijunyu.chatgpt.site",
              })
              req = urllib.request.Request(
                  f"{base}/discovery/resources?{params}",
                  headers=headers,
                  method="GET",
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  data = json.load(response)
              return [
                  item for item in data.get("items", [])
                  if item.get("url") == resource_url
              ], data.get("pagination", {})

          try:
              matches, pagination = get_exact_match()
              print("PREFLIGHT_HTTP_STATUS=200")
              print(f"PREFLIGHT_TOTAL={pagination.get('total', 'unknown')}")
          except Exception as exc:
              print(f"PREFLIGHT_ERROR={type(exc).__name__}: {exc}")
              sys.exit(2)

          if matches:
              print("REGISTRATION_STATUS=ALREADY_INDEXED_NO_POST")
              print("INDEX_MATCH=" + json.dumps(matches[0], sort_keys=True)[:6000])
              sys.exit(0)

          payload = {
              "url": resource_url,
              "type": "http",
              "description": description,
              "accepts": [{
                  "scheme": "exact",
                  "network": "eip155:8453",
                  "asset": "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",
                  "amount": "10000",
                  "payTo": "0xfc479D6b2BC49B21D2517208CaE9dDd2df06E8F2",
              }],
              "metadata": {
                  "name": "Jarvis Domain Verify",
                  "provider": "Jarvis Domain Verify",
                  "category": "Data",
                  "method": "POST",
                  "openapiUrl": openapi_url,
                  "price": "$0.01 USDC",
                  "capabilities": [
                      "company-domain identity verification",
                      "canonical company domain resolution",
                      "entity resolution before lead enrichment",
                      "pre-enrichment spend guard",
                      "Hunter and Apollo preflight",
                  ],
                  "tags": [
                      "company-domain identity",
                      "canonical domain",
                      "entity resolution",
                      "pre-enrichment spend guard",
                      "lead enrichment preflight",
                      "people search preflight",
                      "Hunter preflight",
                      "Apollo preflight",
                  ],
              },
          }

          request = urllib.request.Request(
              f"{base}/discovery/register",
              data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  registration_status = response.status
                  registration_body = response.read(6000).decode("utf-8", "replace")
          except urllib.error.HTTPError as exc:
              registration_status = exc.code
              registration_body = exc.read(6000).decode("utf-8", "replace")
          except Exception as exc:
              print(f"REGISTRATION_TRANSPORT_ERROR={type(exc).__name__}: {exc}")
              sys.exit(3)

          print(f"REGISTRATION_HTTP_STATUS={registration_status}")
          print("REGISTRATION_RESPONSE=" + registration_body.replace("\n", " ")[:6000])

          try:
              matches, pagination = get_exact_match()
              print("INDEX_QUERY_HTTP_STATUS=200")
              print(f"INDEX_QUERY_TOTAL={pagination.get('total', 'unknown')}")
              if matches:
                  print("INDEX_STATUS=VISIBLE")
                  print("INDEX_MATCH=" + json.dumps(matches[0], sort_keys=True)[:6000])
              else:
                  print("INDEX_STATUS=PENDING_INDEX")
          except Exception as exc:
              print(f"INDEX_QUERY_ERROR={type(exc).__name__}: {exc}")

          if 200 <= registration_status < 300 or registration_status in (409, 422):
              sys.exit(0)
          sys.exit(4)
