name: Ultraviolet Jarvis corrective one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ultraviolet-jarvis-corrective-one-shot.yml

permissions:
  contents: read

jobs:
  corrective-register-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate live schema and perform at most one corrective registration
        shell: python
        run: |
          import base64
          import json
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://facilitator.ultravioletadao.xyz"
          resource_url = "https://jarvis-problem-intake.naijunyu.chatgpt.site/b2b/domain-verify"
          openapi_url = "https://jarvis-problem-intake.naijunyu.chatgpt.site/openapi.json"
          description = (
              "Company-domain identity and entity-resolution preflight for agents. "
              "Check whether a website belongs to the intended company, resolve the "
              "canonical domain, and guard paid Hunter, Apollo, people-search, or "
              "lead-enrichment calls from targeting the wrong company."
          )
          headers = {
              "Accept": "application/json",
              "User-Agent": "jarvis-ultraviolet-corrective-one-shot/1.0",
          }

          def request_json(url, *, method="GET", data=None, timeout=45):
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      return response.status, response.headers, response.read(120000).decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.headers, exc.read(120000).decode("utf-8", "replace")

          def get_exact_match():
              params = urllib.parse.urlencode({
                  "limit": 100,
                  "offset": 0,
                  "q": "jarvis-problem-intake.naijunyu.chatgpt.site",
              })
              status, _, body = request_json(f"{base}/discovery/resources?{params}")
              if status != 200:
                  raise RuntimeError(f"discovery query HTTP {status}: {body[:6000]}")
              data = json.loads(body)
              matches = [item for item in data.get("items", []) if item.get("url") == resource_url]
              return matches, data.get("pagination", {})

          # Read the live OpenAPI first. The deployed API describes the registration path;
          # current official backend and SDK sources below establish the concrete nested fields.
          schema_status, _, schema_body = request_json(f"{base}/api-docs/openapi.json")
          print(f"LIVE_OPENAPI_HTTP_STATUS={schema_status}")
          if schema_status != 200:
              print("LIVE_OPENAPI_RESPONSE=" + schema_body.replace("\n", " ")[:6000])
              sys.exit(10)
          live_openapi = json.loads(schema_body)
          if "/discovery/register" not in live_openapi.get("paths", {}):
              print("LIVE_SCHEMA_ERROR=/discovery/register missing from deployed OpenAPI")
              sys.exit(11)
          print("LIVE_SCHEMA_REGISTER_PATH=CONFIRMED")

          backend_commit = "ff781321fc49bc389ebb584104cfc8c6abce8876"
          sdk_commit = "745ae51bd69d0dad5fe2c5e392a9bb108a693db0"
          backend_url = f"https://raw.githubusercontent.com/UltravioletaDAO/x402-rs/{backend_commit}/src/types_v2.rs"
          sdk_url = f"https://raw.githubusercontent.com/UltravioletaDAO/uvd-x402-sdk-python/{sdk_commit}/src/uvd_x402_sdk/discovery.py"
          backend_status, _, backend_body = request_json(backend_url)
          sdk_status, _, sdk_body = request_json(sdk_url)
          print(f"OFFICIAL_BACKEND_SCHEMA_HTTP_STATUS={backend_status}")
          print(f"OFFICIAL_SDK_SCHEMA_HTTP_STATUS={sdk_status}")
          if backend_status != 200 or sdk_status != 200:
              sys.exit(12)

          required_top = ["url", "type", "description", "accepts"]
          required_accept = ["scheme", "network", "asset", "amount", "payTo", "maxTimeoutSeconds"]
          backend_markers = [
              "pub struct RegisterResourceRequest",
              "pub accepts: Vec<PaymentRequirementsV2>",
              "pub struct PaymentRequirementsV2",
              "pub max_timeout_seconds: u64",
          ]
          if not all(marker in backend_body for marker in backend_markers):
              print("OFFICIAL_BACKEND_SCHEMA_ERROR=required type markers missing")
              sys.exit(13)
          if '"maxTimeoutSeconds": 60' not in sdk_body:
              print("OFFICIAL_SDK_SCHEMA_ERROR=maxTimeoutSeconds registration example missing")
              sys.exit(14)
          print("REGISTER_REQUIRED_TOP=" + ",".join(required_top))
          print("REGISTER_REQUIRED_ACCEPTS=" + ",".join(required_accept))
          print("MAX_TIMEOUT_TYPE=u64_integer")
          print("MAX_TIMEOUT_RANGE=0..18446744073709551615_no_narrower_registration_bound_published")
          print("MAX_TIMEOUT_SEMANTICS=maximum_seconds_before_payment_expires")

          # Read Jarvis' current, unpaid x402 challenge. No payment signature is sent.
          challenge_data = json.dumps({
              "company_name": "Stripe",
              "candidate_domain": "stripe.com",
          }).encode("utf-8")
          challenge_headers = {**headers, "Content-Type": "application/json"}
          challenge_req = urllib.request.Request(resource_url, data=challenge_data, headers=challenge_headers, method="POST")
          try:
              with urllib.request.urlopen(challenge_req, timeout=45) as response:
                  print(f"JARVIS_CHALLENGE_HTTP_STATUS={response.status}")
                  sys.exit(15)
          except urllib.error.HTTPError as exc:
              print(f"JARVIS_CHALLENGE_HTTP_STATUS={exc.code}")
              if exc.code != 402:
                  print("JARVIS_CHALLENGE_RESPONSE=" + exc.read(6000).decode("utf-8", "replace").replace("\n", " "))
                  sys.exit(16)
              encoded = exc.headers.get("PAYMENT-REQUIRED")
          if not encoded:
              print("JARVIS_CHALLENGE_ERROR=PAYMENT-REQUIRED header missing")
              sys.exit(17)
          padded = encoded + "=" * (-len(encoded) % 4)
          challenge = json.loads(base64.urlsafe_b64decode(padded).decode("utf-8"))
          accepts = challenge.get("accepts") or []
          if len(accepts) != 1:
              print(f"JARVIS_CHALLENGE_ERROR=expected one accepts entry, got {len(accepts)}")
              sys.exit(18)
          live_accept = accepts[0]
          missing = [field for field in required_accept if field not in live_accept]
          if missing:
              print("JARVIS_CHALLENGE_MISSING=" + ",".join(missing))
              sys.exit(19)
          expected_accept = {
              "scheme": "exact",
              "network": "eip155:8453",
              "asset": "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",
              "amount": "10000",
              "payTo": "0xfc479D6b2BC49B21D2517208CaE9dDd2df06E8F2",
          }
          drift = {key: [expected_accept[key], live_accept.get(key)] for key in expected_accept if live_accept.get(key) != expected_accept[key]}
          if drift:
              print("JARVIS_CHALLENGE_DRIFT=" + json.dumps(drift, sort_keys=True))
              sys.exit(20)
          max_timeout = live_accept["maxTimeoutSeconds"]
          if not isinstance(max_timeout, int) or isinstance(max_timeout, bool) or max_timeout <= 0:
              print(f"JARVIS_MAX_TIMEOUT_INVALID={max_timeout!r}")
              sys.exit(21)
          print(f"JARVIS_MAX_TIMEOUT_SECONDS={max_timeout}")

          try:
              matches, pagination = get_exact_match()
              print("PREFLIGHT_HTTP_STATUS=200")
              print(f"PREFLIGHT_TOTAL={pagination.get('total', 'unknown')}")
          except Exception as exc:
              print(f"PREFLIGHT_ERROR={type(exc).__name__}: {exc}")
              sys.exit(22)

          if matches:
              print("REGISTRATION_STATUS=ALREADY_INDEXED_NO_POST")
              print("INDEX_STATUS=VISIBLE")
              print("INDEX_MATCH=" + json.dumps(matches[0], sort_keys=True)[:6000])
              sys.exit(0)

          # Identical to the rejected one-shot payload, except for the single
          # required field copied from Jarvis' live challenge.
          payload = {
              "url": resource_url,
              "type": "http",
              "description": description,
              "accepts": [{
                  "scheme": "exact",
                  "network": "eip155:8453",
                  "asset": "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",
                  "amount": "10000",
                  "payTo": "0xfc479D6b2BC49B21D2517208CaE9dDd2df06E8F2",
                  "maxTimeoutSeconds": max_timeout,
              }],
              "metadata": {
                  "name": "Jarvis Domain Verify",
                  "provider": "Jarvis Domain Verify",
                  "category": "Data",
                  "method": "POST",
                  "openapiUrl": openapi_url,
                  "price": "$0.01 USDC",
                  "capabilities": [
                      "company-domain identity verification",
                      "canonical company domain resolution",
                      "entity resolution before lead enrichment",
                      "pre-enrichment spend guard",
                      "Hunter and Apollo preflight",
                  ],
                  "tags": [
                      "company-domain identity",
                      "canonical domain",
                      "entity resolution",
                      "pre-enrichment spend guard",
                      "lead enrichment preflight",
                      "people search preflight",
                      "Hunter preflight",
                      "Apollo preflight",
                  ],
              },
          }

          post_headers = {**headers, "Content-Type": "application/json"}
          post_req = urllib.request.Request(
              f"{base}/discovery/register",
              data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
              headers=post_headers,
              method="POST",
          )
          try:
              with urllib.request.urlopen(post_req, timeout=45) as response:
                  registration_status = response.status
                  registration_body = response.read(6000).decode("utf-8", "replace")
          except urllib.error.HTTPError as exc:
              registration_status = exc.code
              registration_body = exc.read(6000).decode("utf-8", "replace")
          except Exception as exc:
              print(f"REGISTRATION_TRANSPORT_ERROR={type(exc).__name__}: {exc}")
              sys.exit(23)

          print("CORRECTIVE_POST_COUNT=1")
          print(f"REGISTRATION_HTTP_STATUS={registration_status}")
          print("REGISTRATION_RESPONSE=" + registration_body.replace("\n", " ")[:6000])
          duplicate_equivalent = registration_status == 409 or (
              registration_status in (400, 422)
              and re.search(r"already.{0,30}(registered|exists)|duplicate", registration_body, re.I)
          )
          acknowledged = 200 <= registration_status < 300 or duplicate_equivalent
          print(f"REGISTRATION_ACKNOWLEDGED={str(bool(acknowledged)).lower()}")
          if not acknowledged:
              print("STOP_NO_THIRD_RETRY=TRUE")
              sys.exit(0)

          try:
              matches, pagination = get_exact_match()
              print("INDEX_QUERY_HTTP_STATUS=200")
              print(f"INDEX_QUERY_TOTAL={pagination.get('total', 'unknown')}")
              if matches:
                  print("INDEX_STATUS=VISIBLE")
                  print("INDEX_MATCH=" + json.dumps(matches[0], sort_keys=True)[:6000])
              else:
                  print("INDEX_STATUS=PENDING_INDEX")
          except Exception as exc:
              print(f"INDEX_QUERY_ERROR={type(exc).__name__}: {exc}")
              print("INDEX_STATUS=PENDING_INDEX")
