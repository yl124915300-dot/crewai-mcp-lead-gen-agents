[project]
name = "lead-gen-agents"
version = "1.0.0"
description = "AI agent crew that generates qualified B2B lead lists with enriched contact data using CrewAI + MCP servers + Google Gemini"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "crewai", "mcp", "ai-agents", "lead-generation", "sales-intelligence",
    "b2b", "prospecting", "google-gemini", "multi-agent", "outbound-sales",
]
dependencies = [
    "crewai>=0.108.0",
    "crewai-tools[mcp]>=0.40.0",
    "mcp>=1.9.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.11.0",
    "rich>=14.0.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.11.0", "pytest>=8.3.0"]
x402 = ["x402[evm,requests]>=2.21.0,<3"]

[project.scripts]
lead-gen = "lead_gen_agents.main:app"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
